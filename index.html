<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1.0,user-scalable=no"/>
  <title>Mazean</title>

  <link href="./favicon.png" rel="icon"/>

  <script>
    function request_pointer_lock_with_unadjusted_movement(e) {
      const promise = e.requestPointerLock({ unadjustedMovement: true });

      if (promise) {
        promise.catch(er => {
          if (er.name === "NotSupportedError") {
            e.requestPointerLock();
          }
        });
      }
    }
  </script>

  <script type="module">
    import init, * as bindings from './client.js';

    init({ module_or_path: './client_bg.wasm' }).then(wasm => {
      window.wasmBindings = bindings;

      dispatchEvent(
        new CustomEvent("TrunkApplicationStarted", {
          detail: { wasm }
        })
      );
    }).catch(err => {
      console.error("Failed to load WASM:", err);
    });
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #91a1b6;
      width: 100%;
      height: 100%;
    }

    canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 0;
      display: block;
    }
  </style>
</head>

<body>

  <!-- Game Render Target -->
  <canvas id="canvas"></canvas>

  <script>
    window.addEventListener("load", () => {
      const fatal = document.getElementById("fatal_error");
      if (fatal) fatal.remove();
    });
  </script>

</body>
</html>
